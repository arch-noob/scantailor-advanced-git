---
name: makepkg

on:
  push:
    branches:
      - master
    tags:
      - 'v**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgbuild:
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j$(nproc)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Makepkg Build and Check
        id: makepkg
        # edlanglois/pkgbuild-action is mostly unmaintained (Nov 2024), but
        # the v1.1.x interface (pkgfile* outputs, SRCINFO check) is stable.
        uses: edlanglois/pkgbuild-action@v1.1.9

      - name: Upload Package Archive
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.makepkg.outputs.pkgfile0 }}
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.makepkg.outputs.pkgfile0 }}