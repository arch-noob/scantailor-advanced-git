---
name: makepkg

on:
  push:
    branches:
      - master
    tags:
      - 'v**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgbuild:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      MAKEFLAGS: -j$(nproc)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache pacman's package download dir. The Qt5/boost toolchain is
      # re-downloaded on every run otherwise (~hundreds of MB). Keyed by
      # PKGBUILD hash so dependency changes invalidate; restore-keys keeps
      # the previous cache as a fallback. On a miss the entry is saved
      # automatically when the job completes successfully.
      # Limits: 10 GB/repo default; entries unused for 7+ days are evicted.
      - name: Restore pacman package cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('PKGBUILD') }}
          restore-keys: |
            pacman-

      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git \
            boost boost-libs cmake libjpeg-turbo \
            libpng libtiff qt5-base qt5-svg qt5-tools zlib

      - name: Build package (as non-root, makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          sudo -u builder env HOME=/home/builder makepkg -f --noconfirm

      - name: Record package path
        id: pkgpath
        run: |
          PKG=$(ls "$GITHUB_WORKSPACE"/*.pkg.tar.zst 2>/dev/null | head -1)
          test -n "$PKG"
          printf 'pkgfile0=%s\n' "$PKG" >> "$GITHUB_ENV"

      - name: Upload Package Archive
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ env.pkgfile0 }}
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.pkgfile0 }}